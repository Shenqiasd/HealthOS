        - cmd: "npm --prefix healthos-v1-ios-prototype run build"
          status: pass
        - cmd: "npm --prefix healthos-v1-ios-prototype audit --audit-level=high"
          status: pass
        - cmd: "node .agents/skills/healthos-long-goal/scripts/scope-guard.mjs verify --baseline docs/goals/healthos-v1/.goalbuddy-board/scopes/T004.json --allow healthos-v1-ios-prototype/package.json --allow healthos-v1-ios-prototype/package-lock.json"
          status: pass
      summary: "Updated Vite from 6.4.2 to 6.4.3 before the initial GitHub baseline; the prototype builds and npm audit reports zero vulnerabilities."
      evidence:
        - "Vite production build completed with 33 modules transformed."
        - "npm audit: found 0 vulnerabilities."
        - "Hash scope guard reported only the two allowed dependency files."
      risks_remaining: []
      next: "Resume T003 and finish the private GitHub baseline."

  - id: T005
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Configure Git whitespace rules so intentional Markdown hard breaks do not fail the baseline while code whitespace remains checked."
    allowed_files:
      - ".gitattributes"
    verify:
      - "git diff --cached --check"
    stop_if:
      - "The rule would disable whitespace checks for source code or non-Markdown files."
      - "The fix requires editing existing plans or files outside allowed_files."
    receipt:
      result: done
      harness: codex
      changed_files:
        - .gitattributes
      commands:
        - cmd: "git diff --cached --check"
          status: pass
        - cmd: "node .agents/skills/healthos-long-goal/scripts/scope-guard.mjs verify --baseline docs/goals/healthos-v1/.goalbuddy-board/scopes/T005.json --allow .gitattributes"
          status: pass
      summary: "Added Git attributes that preserve intentional Markdown hard breaks while retaining whitespace checks for source and configuration files."
      evidence:
        - "The fully staged baseline passes git diff --cached --check."
      risks_remaining: []
      next: "Resume T003 and commit the GitHub baseline."
  - id: T100
