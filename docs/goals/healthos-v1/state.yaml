      - "Do not implement Task 0."
      - "Preserve the plan unless current evidence proves a correction is required."
      - "Identify every decision that requires a named human authority; never infer approval."
      - "Choose one coherent Task 0 Worker package with explicit allowed_files, verify, and stop_if."
    expected_output:
      - "Current repository and prerequisite audit"
      - "Task 0 authority and evidence matrix"
      - "Largest safe first Worker package"
      - "Exact allowed_files, verify commands, and stop conditions"
      - "Blocked or deferred work"
    receipt:
      result: done
      decision: approve_subgoal
      full_outcome_complete: false
      rationale: "当前仓库已有受保护的公开 GitHub 基线、完整技术/实施计划和视觉原型，但尚无生产应用代码。产品负责人已批准进入 Task 0；法律隐私、医学、Apple、企业微信和安全责任人仍未具名签署，因此完整 Task 0 不能诚实通过。先实现不依赖专业签字的治理证据结构、可测试 preflight 检查器和企业微信合成验证协议，是当前最大的安全开发包。"
      worker_package:
        objective: "建立 Task 0 可执行治理地基：创建全部治理证据模板、结构化决策状态、preflight 检查器及测试、企业微信合成数据验证协议；所有未获得的专业决定必须保持 pending，完整 readiness 检查必须继续失败。"
        allowed_files:
          - "docs/product/**"
          - "spikes/wecom-synthetic/**"
          - scripts/check-preflight-gates.mjs
          - scripts/check-preflight-gates.test.mjs
        verify:
          - "node --test scripts/check-preflight-gates.test.mjs"
          - "node scripts/check-preflight-gates.mjs --mode structure"
          - "node scripts/check-preflight-gates.mjs --mode readiness --expect-blocked"
          - "git diff --check"
        stop_if:
          - "实现要求虚构法律、隐私、医学、Apple、企业微信、安全或供应商批准。"
          - "实现要求使用真实健康数据、真实企业微信用户或生产凭证。"
          - "实现需要 allowed_files 之外的文件。"
          - "结构检查或测试连续两次失败且根因不明。"
      evidence:
        - "git status --short --branch: main 与 origin/main 一致且工作树 clean"
        - "当前 HEAD: a1d0386 docs: record public GitHub setup"
        - "仓库已有规划、GoalBuddy 控制、GitHub 基线和 React/Vite 视觉原型，但没有 apps/、packages/ 或生产基础设施"
        - "implementation plan Task 0 要求 11 份治理文件、WeCom synthetic spike 和 executable preflight gate"
        - "technical design 26 节要求四类具名组织责任；这些责任尚无可验证签字"
        - "用户在长期目标中明确授权进入 implementation Task 0"
        - "T006 receipt 证明远端 Actions 仍受 GitHub billing lock 阻塞，但不阻止此本地合成数据包"
