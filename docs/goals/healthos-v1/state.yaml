      parallel_safety:
        parallel_allowed: false
        reason: "GoalBuddy 当前规定单 active_task；先由 PM 把该包固化为窄范围 Worker 任务。"
      blocked_tasks:
        - "T006: 等待用户解除 GitHub billing lock"
        - "T100 完整关闭 Task 0：等待治理证据模板完成及具名专业决定"
