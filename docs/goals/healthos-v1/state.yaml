# GoalBuddy v2 state.yaml
# Board truth lives here. The implementation plan owns scope and dependencies.

version: 2

goal:
  title: "HealthOS V1.0 Production Release"
  slug: "healthos-v1"
  kind: existing_plan
  tranche: "Validate current readiness, close Task 0 gates truthfully, then execute Task 1-27 in dependency order through release evidence."
  status: active
  oracle:
    signal: "The executable release-gate suite and final evidence audit prove Task 27, M6, and every Definition of Done item."
    cadence: "after each Worker package, at every milestone/risk boundary, and at final audit"
    final_proof: "Receipt-backed TestFlight, safety, privacy, security, performance, recovery, operations, rollback, migration, and SLO evidence."
  intake:
    original_request: "Build the complete HealthOS V1 product and preserve correct execution across long sessions and context compaction."
    interpreted_outcome: "A production-grade native iOS health companion reaches the plan's Task 27 release gates with durable, independently auditable evidence."
    input_shape: existing_plan
    audience: "HealthOS product, engineering, medical-review, operations, and release owners"
    authority: approved
    authority_evidence:
      - "2026-07-10: Product owner explicitly approved entering implementation Task 0 and continuing later engineering tasks after their technical and governance dependencies pass."
      - "This approval does not substitute for named legal, privacy, medical, Apple, WeCom, provider, security, incident-response, or backup authority."
    proof_type: review
    completion_proof: "Task 27 and the Definition of Done pass against the implemented system, with a final Judge/PM audit recording full_outcome_complete: true."
    likely_misfire: "Declare success after reproducing the visual prototype or completing only a partial vertical slice."
    blind_spots_considered:
      - "Legal, privacy, medical, Apple, provider, and channel decisions require real named authority."
      - "Mainland China data, distribution, retention, and external-processing constraints."
      - "Long-session drift between plan, board, Git, tests, and receipts."
      - "Reviewer capacity, incident response, backup, rollback, and production evidence."
    existing_plan_facts:
      - "Use docs/plans/2026-07-10-healthos-v1-technical-design.md as the architecture and product contract."
      - "Use docs/plans/2026-07-10-healthos-v1-implementation.md as scope, dependency, verification, and release truth."
      - "Execute M0-M6 and Task 0-27; downstream tasks wait for applicable gates and listed dependencies."
      - "The image-backed prototype is design reference only and must not be copied into the native product."
      - "Product-owner approval to enter implementation Task 0 is still required by the technical design."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: generated
    url: null
    command: "bash .agents/skills/healthos-long-goal/scripts/goalbuddy.sh board docs/goals/healthos-v1"

active_task: T015

tasks:
