      - "Read-only outside GoalBuddy control files."
      - "Do not implement Task 0."
      - "Preserve the plan unless current evidence proves a correction is required."
      - "Identify every decision that requires a named human authority; never infer approval."
      - "Choose one coherent Task 0 Worker package with explicit allowed_files, verify, and stop_if."
    expected_output:
      - "Current repository and prerequisite audit"
      - "Task 0 authority and evidence matrix"
      - "Largest safe first Worker package"
      - "Exact allowed_files, verify commands, and stop conditions"
      - "Blocked or deferred work"
