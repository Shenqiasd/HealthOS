# GoalBuddy v2 state.yaml
# Board truth lives here. The implementation plan owns scope and dependencies.

version: 2

goal:
  title: "HealthOS V1.0 Production Release"
  slug: "healthos-v1"
  kind: existing_plan
  tranche: "Validate current readiness, close Task 0 gates truthfully, then execute Task 1-27 in dependency order through release evidence."
  status: active
  oracle:
    signal: "The executable release-gate suite and final evidence audit prove Task 27, M6, and every Definition of Done item."
    cadence: "after each Worker package, at every milestone/risk boundary, and at final audit"
    final_proof: "Receipt-backed TestFlight, safety, privacy, security, performance, recovery, operations, rollback, migration, and SLO evidence."
  intake:
    original_request: "Build the complete HealthOS V1 product and preserve correct execution across long sessions and context compaction."
    interpreted_outcome: "A production-grade native iOS health companion reaches the plan's Task 27 release gates with durable, independently auditable evidence."
    input_shape: existing_plan
    audience: "HealthOS product, engineering, medical-review, operations, and release owners"
    authority: needs_approval
    proof_type: review
    completion_proof: "Task 27 and the Definition of Done pass against the implemented system, with a final Judge/PM audit recording full_outcome_complete: true."
    likely_misfire: "Declare success after reproducing the visual prototype or completing only a partial vertical slice."
    blind_spots_considered:
      - "Legal, privacy, medical, Apple, provider, and channel decisions require real named authority."
      - "Mainland China data, distribution, retention, and external-processing constraints."
      - "Long-session drift between plan, board, Git, tests, and receipts."
      - "Reviewer capacity, incident response, backup, rollback, and production evidence."
    existing_plan_facts:
      - "Use docs/plans/2026-07-10-healthos-v1-technical-design.md as the architecture and product contract."
      - "Use docs/plans/2026-07-10-healthos-v1-implementation.md as scope, dependency, verification, and release truth."
      - "Execute M0-M6 and Task 0-27; downstream tasks wait for applicable gates and listed dependencies."
      - "The image-backed prototype is design reference only and must not be copied into the native product."
      - "Product-owner approval to enter implementation Task 0 is still required by the technical design."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: generated
    url: null
    command: "bash .agents/skills/healthos-long-goal/scripts/goalbuddy.sh board docs/goals/healthos-v1"

active_task: T001

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: active
    reasoning_hint: high
    objective: "Audit the existing technical and implementation plans against current repository reality, then turn Task 0 into the largest safe executable first package without changing product files."
    inputs:
      - "docs/goals/healthos-v1/goal.md"
      - "docs/plans/2026-07-10-healthos-v1-technical-design.md"
      - "docs/plans/2026-07-10-healthos-v1-implementation.md"
      - "Current Git status and repository tree"
    constraints:
      - "Read-only outside GoalBuddy control files."
      - "Do not implement Task 0."
      - "Preserve the plan unless current evidence proves a correction is required."
      - "Identify every decision that requires a named human authority; never infer approval."
      - "Choose one coherent Task 0 Worker package with explicit allowed_files, verify, and stop_if."
    expected_output:
      - "Current repository and prerequisite audit"
      - "Task 0 authority and evidence matrix"
      - "Largest safe first Worker package"
      - "Exact allowed_files, verify commands, and stop conditions"
      - "Blocked or deferred work"
    receipt: null

  - id: T002
    type: pm
    assignee: PM
    status: queued
    reasoning_hint: high
    objective: "Apply the T001 decision to the rolling board, request only mandatory owner inputs, and activate the first Task 0 Worker package when its authority is real."
    inputs:
      - "T001 receipt"
      - "Task 0 from the implementation plan"
    constraints:
      - "Edit GoalBuddy control files only."
      - "Do not fabricate sign-off or convert a missing decision into approval."
      - "If an exact human decision is mandatory, record required_reply and waiting_for_user_approval."
    expected_output:
      - "Updated board"
      - "Named missing inputs, if any"
      - "Activated Worker task or truthful blocked receipt"
    receipt: null

  - id: T003
    type: worker
    assignee: Worker
    status: blocked
    reasoning_hint: high
    objective: "Create the private GitHub repository and production-ready source-control baseline without beginning HealthOS feature implementation."
    allowed_files:
      - ".gitignore"
      - ".editorconfig"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".github/**"
      - "healthos-v1-ios-prototype/.npmrc"
      - "healthos-v1-ios-prototype/.npm-cache/**"
      - "healthos-v1-ios-prototype/dist/**"
    verify:
      - "node --test .agents/skills/healthos-long-goal/scripts/*.test.mjs"
      - "bash .agents/skills/healthos-long-goal/scripts/goalbuddy.sh resume docs/goals/healthos-v1 --json"
      - "npm --prefix healthos-v1-ios-prototype ci"
      - "npm --prefix healthos-v1-ios-prototype run build"
      - "git diff --check"
      - "gh auth status"
      - "gh run list --limit 5"
    stop_if:
      - "GitHub authentication is unavailable or lacks repo/workflow scope."
      - "Shenqiasd/HealthOS already exists with unrelated content."
      - "A credential, real health-data file, or file larger than GitHub limits would be committed."
      - "The baseline requires modifying files outside allowed_files."
      - "Local verification or initial GitHub Actions remains red without a confirmed external cause."
    receipt:
      result: blocked
      harness: codex
      blocked_reason: "GitHub accepted the private repository and main push, but every private-repository runner allocation ends immediately with startup_failure, including a manual Baseline dispatch and both Dependabot update jobs. Repository Actions permissions are enabled, actionlint passes, and GitHub Status reports Actions operational, so the remaining blocker is the Shenqiasd account's private Actions usage, quota, or billing state."
      changed_files:
        - .gitignore
        - .editorconfig
        - README.md
        - CONTRIBUTING.md
        - SECURITY.md
        - .github/CODEOWNERS
        - .github/PULL_REQUEST_TEMPLATE.md
        - .github/dependabot.yml
        - .github/workflows/baseline.yml
        - healthos-v1-ios-prototype/.npmrc
      commands:
        - cmd: "node --test .agents/skills/healthos-long-goal/scripts/*.test.mjs"
          status: pass
        - cmd: "bash .agents/skills/healthos-long-goal/scripts/goalbuddy.sh resume docs/goals/healthos-v1 --json"
          status: pass
        - cmd: "npm --prefix healthos-v1-ios-prototype ci"
          status: pass
        - cmd: "npm --prefix healthos-v1-ios-prototype run build"
          status: pass
        - cmd: "npm --prefix healthos-v1-ios-prototype audit --audit-level=high"
          status: pass
        - cmd: "git diff --cached --check"
          status: pass
        - cmd: "actionlint .github/workflows/baseline.yml"
          status: pass
        - cmd: "gh repo create Shenqiasd/HealthOS --private --source=. --remote=origin --push"
          status: pass
        - cmd: "gh workflow run baseline.yml --repo Shenqiasd/HealthOS --ref main"
          status: fail
      summary: "Created and pushed the private HealthOS repository with collaboration, security, dependency, CI, and long-goal controls. Local verification is green; remote Actions cannot allocate a runner because of an account-level private Actions constraint."
      evidence:
        - "Repository: https://github.com/Shenqiasd/HealthOS"
        - "Baseline commit: 4d02218d2262b0795c8f56102ee8e29de7e62be9"
        - "Initial startup failure: https://github.com/Shenqiasd/HealthOS/actions/runs/29080745748"
        - "Manual dispatch startup failure: https://github.com/Shenqiasd/HealthOS/actions/runs/29081382736"
        - "Dependabot startup failure: https://github.com/Shenqiasd/HealthOS/actions/runs/29080749911"
        - "GitHub Actions permissions API: enabled with allowed_actions=all"
        - "GitHub Status: Actions operational"
        - "Independent actionlint v1.7.12 validation exited 0"
      spawned_tasks:
        - T004
        - T005
      risks_remaining:
        - "Required GitHub checks and Dependabot execution remain unavailable until private Actions runner allocation is restored."
        - "GitHub Secret Scanning is unavailable on the current private-repository plan; Gitleaks is configured but cannot run until Actions is restored."
      next: "In GitHub Settings > Billing and licensing, restore private Actions minutes or spending, then rerun Baseline and Dependabot. T001 may continue as read-only work in parallel."
  - id: T004
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: high
    objective: "Remove the known high-severity Vite vulnerability before the initial GitHub baseline commit."
    allowed_files:
      - "healthos-v1-ios-prototype/package.json"
      - "healthos-v1-ios-prototype/package-lock.json"
    verify:
      - "npm --prefix healthos-v1-ios-prototype ci"
      - "npm --prefix healthos-v1-ios-prototype run build"
      - "npm --prefix healthos-v1-ios-prototype audit --audit-level=high"
    stop_if:
      - "The fix requires a major-version migration or product behavior change."
      - "The fix requires files outside allowed_files."
      - "Build or audit remains red after the minimum patch-level update."
    receipt:
      result: done
      harness: codex
      changed_files:
        - healthos-v1-ios-prototype/package.json
        - healthos-v1-ios-prototype/package-lock.json
      commands:
        - cmd: "npm --prefix healthos-v1-ios-prototype ci"
