        id: { type: string, format: uuid }
        code: { $ref: "#/components/schemas/ActionCode" }
        version: { type: integer, minimum: 1 }
    MapSignalDetail:
      type: object
      additionalProperties: false
      required: [code, state, trend, confidence, freshness, drivers, today_action_link]
      properties:
        code: { $ref: "#/components/schemas/SignalCode" }
        state: { $ref: "#/components/schemas/SignalState" }
        trend: { $ref: "#/components/schemas/SignalTrend" }
        confidence: { type: number, minimum: 0, maximum: 1 }
        freshness: { $ref: "#/components/schemas/SignalFreshness" }
        drivers:
          type: array
          items: { $ref: "#/components/schemas/MapSignalDriver" }
        today_action_link:
          oneOf:
            - $ref: "#/components/schemas/MapTodayActionLink"
            - type: "null"
    MapViewModel:
      type: object
      additionalProperties: false
      required: [schema_version, local_date, generated_at, signals, selected]
      properties:
        schema_version: { const: 1 }
        local_date: { type: string, format: date }
        generated_at: { type: [string, "null"], format: date-time }
        signals:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/MapSignalSummary" }
        selected:
          oneOf:
            - $ref: "#/components/schemas/MapSignalDetail"
            - type: "null"
    ReviewConclusionKey:
      type: string
      enum:
        - review.conclusion.no_data
        - review.conclusion.partial_week
        - review.conclusion.improving
        - review.conclusion.mixed
        - review.conclusion.watch
        - review.conclusion.stable
    ReviewFrictionCode:
      type: string
      enum:
        - review.friction.no_actions
        - review.friction.all_skipped
        - review.friction.mostly_completed
        - review.friction.mixed
    ReviewEvidenceRow:
      type: object
      additionalProperties: false
      required: [signal_code, state, trend, freshness, days_observed]
      properties:
        signal_code: { $ref: "#/components/schemas/SignalCode" }
        state: { $ref: "#/components/schemas/SignalState" }
        trend: { $ref: "#/components/schemas/SignalTrend" }
        freshness: { $ref: "#/components/schemas/SignalFreshness" }
        days_observed: { type: integer, minimum: 1, maximum: 7 }
    ReviewFrictionSummary:
      type: object
      additionalProperties: false
      required: [code, completed, skipped, replaced]
      properties:
        code: { $ref: "#/components/schemas/ReviewFrictionCode" }
        completed: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        replaced: { type: integer, minimum: 0 }
    ReviewNextAction:
      type: object
      additionalProperties: false
      required: [assignment_id, action_code]
      properties:
        assignment_id: { type: string, format: uuid }
        action_code: { $ref: "#/components/schemas/ActionCode" }
    WeeklyReviewViewModel:
      type: object
      additionalProperties: false
      required: [schema_version, id, week_start, week_end, cutoff_at, revision, coverage, conclusion_key, evidence, friction, next_actions, generated_at]
      properties:
        schema_version: { const: 1 }
        id: { type: string, format: uuid }
        week_start: { type: string, format: date }
        week_end: { type: string, format: date }
        cutoff_at: { type: string, format: date-time }
        revision: { type: integer, minimum: 1 }
        coverage: { type: number, minimum: 0, maximum: 1 }
        conclusion_key: { $ref: "#/components/schemas/ReviewConclusionKey" }
        evidence:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ReviewEvidenceRow" }
        friction: { $ref: "#/components/schemas/ReviewFrictionSummary" }
        next_actions:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ReviewNextAction" }
        generated_at: { type: string, format: date-time }
    ReviewShareVariant:
      type: string
      enum: [redacted, private]
    ReviewRedactedNextAction:
      type: object
      additionalProperties: false
      required: [action_code]
      properties:
        action_code: { $ref: "#/components/schemas/ActionCode" }
    RedactedReviewSharePayload:
      type: object
      additionalProperties: false
      required: [schema_version, review_id, variant, week_start, week_end, coverage, conclusion_key, evidence, friction, next_actions]
      properties:
        schema_version: { const: 1 }
        review_id: { type: string, format: uuid }
        variant: { const: redacted }
        week_start: { type: string, format: date }
        week_end: { type: string, format: date }
        coverage: { type: number, minimum: 0, maximum: 1 }
        conclusion_key: { $ref: "#/components/schemas/ReviewConclusionKey" }
        evidence:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ReviewEvidenceRow" }
        friction: { $ref: "#/components/schemas/ReviewFrictionSummary" }
        next_actions:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ReviewRedactedNextAction" }
    PrivateReviewSharePayload:
      type: object
      additionalProperties: false
      required: [schema_version, review_id, variant, week_start, week_end, coverage, conclusion_key, evidence, friction, next_actions]
      properties:
        schema_version: { const: 1 }
        review_id: { type: string, format: uuid }
        variant: { const: private }
        week_start: { type: string, format: date }
        week_end: { type: string, format: date }
        coverage: { type: number, minimum: 0, maximum: 1 }
        conclusion_key: { $ref: "#/components/schemas/ReviewConclusionKey" }
        evidence:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ReviewEvidenceRow" }
        friction: { $ref: "#/components/schemas/ReviewFrictionSummary" }
        next_actions:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ReviewNextAction" }
    ReviewSharePayload:
      oneOf:
        - $ref: "#/components/schemas/RedactedReviewSharePayload"
        - $ref: "#/components/schemas/PrivateReviewSharePayload"
      discriminator:
        propertyName: variant
        mapping:
          redacted: "#/components/schemas/RedactedReviewSharePayload"
          private: "#/components/schemas/PrivateReviewSharePayload"
    ReviewShareResponse:
      type: object
      additionalProperties: false
      required: [id, expires_at, payload]
      properties:
        id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        payload: { $ref: "#/components/schemas/ReviewSharePayload" }
    ReviewGenerationRequest:
      type: object
      additionalProperties: false
      required: [week_start, cutoff_at, idempotency_key]
      properties:
        week_start: { type: string, format: date }
        cutoff_at: { type: string, format: date-time }
        idempotency_key: { type: string, format: uuid }
    ReviewGenerationResponse:
      type: object
      additionalProperties: false
      required: [request_id, status]
      properties:
        request_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, leased, sent, failed, suppressed]
    ActionCode:
      type: string
      enum: [SLEEP_WIND_DOWN, SLEEP_WIND_DOWN_LIGHT, POST_MEAL_WALK, SUGARY_DRINK_SWAP]
    ActionFeedbackReason:
      type: string
      enum: [too_hard, no_time, tired, uncomfortable, weather, neutral]
    ActionFeedbackRequest:
      oneOf:
        - $ref: "#/components/schemas/ActionCompleteRequest"
        - $ref: "#/components/schemas/ActionSkipRequest"
        - $ref: "#/components/schemas/ActionLighterRequest"
        - $ref: "#/components/schemas/ActionSwapRequest"
    ActionCompleteRequest:
      type: object
      additionalProperties: false
      required: [command, expected_version, idempotency_key]
      properties:
        command: { const: complete }
        expected_version: { type: integer, minimum: 1 }
        idempotency_key: { type: string, format: uuid }
    ActionSkipRequest:
      type: object
      additionalProperties: false
      required: [command, reason_code, expected_version, idempotency_key]
      properties:
        command: { const: skip }
        reason_code: { type: string, enum: [no_time, tired, uncomfortable, weather, neutral] }
        expected_version: { type: integer, minimum: 1 }
        idempotency_key: { type: string, format: uuid }
    ActionLighterRequest:
      type: object
      additionalProperties: false
      required: [command, reason_code, expected_version, idempotency_key]
      properties:
        command: { const: lighter }
        reason_code: { const: too_hard }
        expected_version: { type: integer, minimum: 1 }
        idempotency_key: { type: string, format: uuid }
    ActionSwapRequest:
      type: object
      additionalProperties: false
      required: [command, expected_version, idempotency_key]
      properties:
        command: { const: swap }
        reason_code:
          $ref: "#/components/schemas/ActionFeedbackReason"
        expected_version: { type: integer, minimum: 1 }
        idempotency_key: { type: string, format: uuid }
    ActionFeedbackAssignment:
      type: object
      additionalProperties: false
      required: [id, code, status, version, difficulty]
      properties:
        id: { type: string, format: uuid }
        code:
          $ref: "#/components/schemas/ActionCode"
        status: { type: string, enum: [active, completed, skipped, replaced] }
        version: { type: integer, minimum: 1 }
        difficulty: { type: string, enum: [light, standard] }
    ActionFeedbackResponse:
      type: object
      additionalProperties: false
      required: [schema_version, feedback_event_id, idempotency_key, outcome, reason_code, original_action, current_action, recovery_key]
      properties:
        schema_version: { const: 1 }
        feedback_event_id: { type: string, format: uuid }
        idempotency_key: { type: string, format: uuid }
        outcome: { type: string, enum: [completed, skipped, replaced, no_safe_alternative] }
        reason_code:
          oneOf:
            - $ref: "#/components/schemas/ActionFeedbackReason"
            - const: no_safe_alternative
            - type: "null"
        original_action:
          $ref: "#/components/schemas/ActionFeedbackAssignment"
        current_action:
          oneOf:
            - $ref: "#/components/schemas/ActionFeedbackAssignment"
            - type: "null"
        recovery_key: { type: [string, "null"] }
