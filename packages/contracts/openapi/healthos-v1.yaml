openapi: 3.1.0
info:
  title: HealthOS API
  version: 1.0.0
  description: HealthOS V1 client and operations contract.
servers:
  - url: http://127.0.0.1:3000
    description: Local synthetic development only
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Process liveness
      responses:
        "200":
          description: The API process is alive.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Dependency readiness
      responses:
        "200":
          description: Every required dependency is ready.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more required dependencies are not ready.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /identity/apple/nonce:
    post:
      operationId: issueAppleNonce
      summary: Issue a single-use nonce for Sign in with Apple
      responses:
        "200":
          description: A short-lived nonce was issued.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NonceResponse"
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /identity/apple:
    post:
      operationId: authenticateWithApple
      summary: Exchange a verified Apple identity token and nonce for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleAuthenticationRequest"
      responses:
        "200":
          description: The Apple identity was authenticated.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /identity/refresh:
    post:
      operationId: rotateRefreshToken
      summary: Atomically rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: A new access and refresh token pair was issued.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokensResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /identity/logout:
    post:
      operationId: logoutSessionFamily
      summary: Revoke the refresh-token family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: The operation is complete, including for an unknown token.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /identity/devices:
    post:
      operationId: registerDevice
      summary: Idempotently register a device owned by the authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistrationRequest"
      responses:
        "200":
          description: The device was registered or updated.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegistrationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    CorrelationId:
      description: Validated incoming identifier or a server-generated UUID.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    Unauthorized:
      description: Authentication failed or the session is no longer active.
      headers:
        x-correlation-id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    IdentityUnavailable:
      description: Identity configuration is unavailable or incomplete.
      headers:
        x-correlation-id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    DependencyHealth:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [not_configured, ok, error]
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [not_ready, ready]
        dependencies:
          type: object
          additionalProperties: false
          required: [database, object_storage, worker_lease]
          properties:
            database:
              $ref: "#/components/schemas/DependencyHealth"
            object_storage:
              $ref: "#/components/schemas/DependencyHealth"
            worker_lease:
              $ref: "#/components/schemas/DependencyHealth"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlation_id]
          properties:
            code:
              type: string
            message:
              type: string
            correlation_id:
              type: string
    NonceResponse:
      type: object
      additionalProperties: false
      required: [nonce, expires_at]
      properties:
        nonce:
          type: string
          minLength: 32
        expires_at:
          type: string
          format: date-time
    AppleAuthenticationRequest:
      type: object
      additionalProperties: false
      required: [identity_token, nonce]
      properties:
        identity_token:
          type: string
          minLength: 32
        nonce:
          type: string
          minLength: 32
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 32
    SessionTokensResponse:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
          minLength: 32
        refresh_token:
          type: string
          minLength: 32
    AuthenticationResponse:
      type: object
      additionalProperties: false
      required: [user_id, access_token, refresh_token]
      properties:
        user_id:
          type: string
          format: uuid
        access_token:
          type: string
          minLength: 32
        refresh_token:
          type: string
          minLength: 32
    LogoutResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: revoked
    DeviceRegistrationRequest:
      type: object
      additionalProperties: false
      required: [device_id, app_version]
      properties:
        device_id:
          type: string
          minLength: 8
          maxLength: 128
        app_version:
          type: string
          minLength: 1
          maxLength: 32
        apns_token:
          type: string
          minLength: 16
          maxLength: 512
    DeviceRegistrationResponse:
      type: object
      additionalProperties: false
      required: [id, device_id, app_version]
      properties:
        id:
          type: string
          format: uuid
        device_id:
          type: string
        app_version:
          type: [string, "null"]
