openapi: 3.1.0
info:
  title: HealthOS API
  version: 1.0.0
  description: HealthOS V1 client and operations contract.
servers:
  - url: http://127.0.0.1:3000
    description: Local synthetic development only
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Process liveness
      responses:
        "200":
          description: The API process is alive.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Dependency readiness
      responses:
        "200":
          description: Every required dependency is ready.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more required dependencies are not ready.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /health/sync:
    post:
      operationId: ingestHealthSyncBatch
      summary: Ingest consented day-level health aggregates from the primary device
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthSyncRequest"
      responses:
        "200":
          description: The accepted run or its idempotent replay result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSyncResponse"
        "400":
          description: Batch schema or metric bounds are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Consent, active-user, device ownership, or primary-device check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
  /health/freshness:
    get:
      operationId: getHealthFreshness
      summary: Read aggregate availability and freshness without interpretation
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current aggregate freshness state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthFreshnessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /today:
    get:
      operationId: getToday
      summary: Read one published current action or one explicit recovery state
      security:
        - BearerAuth: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The current versioned Today projection.
          headers:
            ETag:
              description: Weak validator for the stable business projection.
              schema:
                type: string
            Cache-Control:
              schema:
                const: private, no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayViewModel"
        "304":
          description: The business projection is unchanged.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current active-user, consent, or privacy reconciliation gate failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /map:
    get:
      operationId: getHealthSignalMap
      summary: Read immutable semantic signal summaries and one selected detail
      security:
        - BearerAuth: []
      parameters:
        - name: selected
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SignalCode"
      responses:
        "200":
          description: Current provenance-qualified Map projection without raw health values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapViewModel"
        "400":
          description: The selected signal code is unsupported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current active-user, consent, or privacy reconciliation gate failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /reviews/generations:
    post:
      operationId: requestWeeklyReviewGeneration
      summary: Enqueue one consent-bound weekly Review generation request
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewGenerationRequest"
      responses:
        "200":
          description: Generation request accepted or exactly replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewGenerationResponse"
        "400":
          description: Runtime request validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current processing authorization is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Generation window or idempotency identity conflicted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /reviews/current:
    get:
      operationId: getCurrentWeeklyReview
      summary: Read the latest immutable weekly Review snapshot
      security:
        - BearerAuth: []
      parameters:
        - name: week_start
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Current consent-qualified weekly Review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyReviewViewModel"
        "400":
          description: Week query validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current processing authorization is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No production weekly Review is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /reviews/{reviewId}/shares/{variant}:
    get:
      operationId: getWeeklyReviewShare
      summary: Read one owner-scoped unexpired private or redacted share payload
      security:
        - BearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: variant
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ReviewShareVariant" }
      responses:
        "200":
          description: Immutable share payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewShareResponse"
        "400":
          description: Share variant is unsupported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current processing authorization is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Share does not belong to the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: Share payload expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /actions/{id}/feedback:
    post:
      operationId: applyActionFeedback
      summary: Idempotently apply one versioned command to the current primary action
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionFeedbackRequest"
      responses:
        "200":
          description: The committed transition or its exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionFeedbackResponse"
        "400":
          description: Command, reason, version, or idempotency identity is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The action is not owned by the caller or current processing authorization is absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /profile/candidates:
    post:
      operationId: proposeProfileCandidate
      summary: Store a typed pending candidate without retaining source free text
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileCandidateRequest"
      responses:
        "200":
          description: A pending typed candidate; source free text is never returned or persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileCandidateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current health-processing consent is absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
  /profile/candidates/{id}/confirm:
    post:
      operationId: confirmProfileCandidate
      summary: Confirm an immutable typed candidate into the append-only profile ledger
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The confirmed candidate and its unique profile event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileCandidateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current health-processing consent is absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /profile/snapshot:
    get:
      operationId: getCurrentProfileSnapshot
      summary: Read the latest immutable snapshot authorized by the current consent epoch
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The current deterministic profile projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSnapshotResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current health-processing consent is absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /identity/apple/nonce:
    post:
      operationId: issueAppleNonce
      summary: Issue a single-use nonce for Sign in with Apple
      responses:
        "200":
          description: A short-lived nonce was issued.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NonceResponse"
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /identity/apple:
    post:
      operationId: authenticateWithApple
      summary: Exchange a verified Apple identity token and nonce for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleAuthenticationRequest"
      responses:
        "200":
          description: The Apple identity was authenticated.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /identity/refresh:
    post:
      operationId: rotateRefreshToken
      summary: Atomically rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: A new access and refresh token pair was issued.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokensResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /identity/logout:
    post:
      operationId: logoutSessionFamily
      summary: Revoke the refresh-token family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: The operation is complete, including for an unknown token.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /identity/devices:
    post:
      operationId: registerDevice
      summary: Idempotently register a device owned by the authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistrationRequest"
      responses:
        "200":
          description: The device was registered or updated.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegistrationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/IdentityUnavailable"
  /consents:
    get:
      operationId: getConsentSettings
      summary: Read current consent state by independent purpose
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current consent settings derived from append-only records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: writeConsent
      summary: Append a versioned consent grant or withdrawal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentWriteRequest"
      responses:
        "200":
          description: The idempotent consent record and global epoch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecordResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /privacy/exports:
    post:
      operationId: requestPrivacyExport
      summary: Idempotently request a machine-readable export
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequestBody"
      responses:
        "200":
          description: The existing or newly requested export job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/PrivacyUnavailable"
  /privacy/exports/{id}:
    get:
      operationId: getPrivacyExport
      summary: Read an export job owned by the authenticated user
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Current export status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /privacy/deletions:
    post:
      operationId: requestPrivacyDeletion
      summary: Freeze processing and request deletion
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequestBody"
      responses:
        "200":
          description: Processing is frozen and a scoped status token is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/PrivacyUnavailable"
  /privacy/deletions/{id}:
    get:
      operationId: getPrivacyDeletion
      summary: Read deletion progress using the scoped status token
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: x-deletion-status-token
          in: header
          required: true
          schema:
            type: string
            minLength: 64
            maxLength: 128
      responses:
        "200":
          description: Current deletion status without restoring ordinary access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/review-tasks:
    get:
      operationId: listAdminReviewTasks
      summary: List minimum-necessary operations review tasks in stable SLA order
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminQueueLimit"
        - $ref: "#/components/parameters/AdminQueueCursor"
        - $ref: "#/components/parameters/AdminQueueStatus"
      responses:
        "200":
          description: Role- and subject-scoped review queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReviewTaskPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/safety-controls:
    get:
      operationId: listAdminSafetyControls
      summary: List the latest bounded feature-flag and kill-switch revisions
      security:
        - adminBearerAuth: []
      responses:
        "200":
          description: Latest control revision for each logical scope, without raw user identifiers in audit snapshots.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSafetyControlPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/safety-controls/actions:
    post:
      operationId: mutateAdminSafetyControl
      summary: Append one MFA-authorized and same-transaction audited control revision
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminCorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSafetyControlActionRequest" }
      responses:
        "200":
          description: Created control revision or exact idempotent replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSafetyControl" }
        "400":
          description: Invalid key, scope, reason code, correlation identifier, or referenced resource.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /reminders/preferences:
    get:
      operationId: getReminderPreferences
      summary: Read the authenticated user's respectful reminder preferences
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current stored preferences or a disabled default.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderPreferenceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/PrivacyUnavailable" }
    put:
      operationId: updateReminderPreferences
      summary: Replace reminder preferences with optimistic versioning and exact idempotency
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderPreferenceUpdateRequest" }
      responses:
        "200":
          description: Versioned preferences after the mutation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderPreferenceResponse" }
        "400":
          description: Invalid timezone, target time, quiet hours, or preference body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/PrivacyUnavailable" }
  /admin/review-tasks/{taskId}/actions:
    post:
      operationId: mutateAdminReviewTask
      summary: Claim, reassign, or release an operations review task with audit fencing
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminTaskId"
        - $ref: "#/components/parameters/AdminCorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReviewWorkflowActionRequest" }
      responses:
        "200":
          description: Versioned review task after the audited mutation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReviewTask" }
        "400":
          description: Invalid action, reason, correlation identifier, or target actor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/safety-incidents:
    get:
      operationId: listAdminSafetyIncidents
      summary: List redacted safety incidents for operators and administrators
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminQueueLimit"
        - $ref: "#/components/parameters/AdminQueueCursor"
        - $ref: "#/components/parameters/AdminQueueStatus"
      responses:
        "200":
          description: Redacted safety incident queue without encrypted detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSafetyIncidentPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/safety-incidents/{incidentId}/actions:
    post:
      operationId: mutateAdminSafetyIncident
      summary: Acknowledge, resolve, or reopen one safety incident with audit fencing
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminIncidentId"
        - $ref: "#/components/parameters/AdminCorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSafetyWorkflowActionRequest" }
      responses:
        "200":
          description: Versioned safety incident after the audited mutation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSafetyIncident" }
        "400":
          description: Invalid action, reason, or correlation identifier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Provider-neutral administrator token with MFA
  headers:
    CorrelationId:
      description: Validated incoming identifier or a server-generated UUID.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminTaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdminIncidentId:
      name: incidentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdminQueueLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    AdminQueueCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 8, maxLength: 1024 }
    AdminQueueStatus:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [pending, active, completed] }
    AdminCorrelationId:
      name: x-correlation-id
      in: header
      required: true
      description: Client-generated UUID used to correlate the audited mutation.
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Authentication failed or the session is no longer active.
      headers:
        x-correlation-id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: MFA, administrator status, role, or subject scope does not permit the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    IdentityUnavailable:
      description: Identity configuration is unavailable or incomplete.
      headers:
        x-correlation-id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PrivacyUnavailable:
      description: Privacy control storage or required key configuration is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The requested transition or idempotency key conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The resource is absent or not owned by the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
